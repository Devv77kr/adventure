<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive SCSS Layout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <section>

            <!-- Image Section -->
            <div class="top">
                <img src="image.png" alt="Beautiful Landscape">

            </div>

            <!-- Content Section -->
            <div class="bottom">

                <div class="text">

                    <h1>
                        Explore<br>
                        The World
                    </h1>

                    <p>
                        Discover beautiful places, experience new
                        adventures, and create unforgettable memories.
                    </p>

                    <button>
                        Explore Now
                    </button>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
